ressive",prog:yc("draw"),tip:{above:us},setup:["One ball on the center spot. Shoot it straight along the diagonal into a corner of your choice and draw the cue ball straight back to the opposite corner.","Right-handed players put the cue ball on the left side of the table, left-handed players on the right. Cue ball 1, 2 or 3 diamonds back by level, measured along the long rail. Level 3 is quite advanced.","Note made, drawn back to the rail, or drawn into the corner (it must go in). Re-spot after each shot; a miss is repeated until it’s made."],target:{text:"Sets of 10 makes.",unit:"makes"}}],tg=[...eg,...Zf,{id:"transitions-1",name:"Transitions-1",category:"transitions",tags:[{value:"ec-transitions-1"}],aliases:["pool kata bassai 9 ball","pool kata","kata"],diagram:null,editableLayout:!0,counters:"completion",ballsPerRack:9,learning:Zl,tip:[{label:"First shot, new cloth",right:1.25},{label:"First shot, worn cloth",right:.75}],setup:["1 on the right rail and 2 on the left rail, each at the second diamond beside the head spot; 3 at the middle diamond of the head rail; 4 on the head spot.","5 on the right rail and 7 on the left rail, each at the second diamond beside the foot spot; 6 at the middle diamond of the foot rail; 8 on the foot spot; 9 on the center spot.","Rail balls one ball-width off the cushion. Cue ball 1½ balls uptable of the 9. First shot: cue tip one and a quarter tips right of center on new cloth, three quarters of a tip on worn cloth.","Several ways to complete it, using different transitions from each ball to the next. Focus: fine-tune position with slightly more or less spin on chosen shots."],target:{text:"Log every rack: completed, or the ball where the run ended.",unit:"racks"}},{id:"ghost-8",minutes:25,name:"8-ball progressive ghost",category:"runout",tags:[{value:"ec-ghost-8"}],aliases:["8 ball ghost","8-ball ghost","progressive ghost 8"],diagram:Gf,counters:"ghost",ghost:{game:"8-ball",balls:15,minLevel:3,maxLevel:8},setup:["Rack all fifteen iards"],diagram:zf,counters:"none",scorer:"bowling",setup:[Nh,"Rack ten balls and break. Each frame is one rack, with two innings to clear it.","All ten in the first inning is a strike (10 plus your next two innings); all ten across both innings is a spare (10 plus your next inning). The tenth frame earns its bonus innings. 300 is perfect.","Play your usual rules for the break and ball in hand; the scorer only needs the balls you ran in each inning.","An offensive drill: it measures how far you get through a rack, so run-out planning and position decide it."],target:{text:"One full game each time (60–90 minutes). Score it with the scorer (Open the scorer below) and watch the average of your last five.",unit:"racks"}},{id:"spot",minutes:8,name:"Progressive spot shot",category:"reps",tags:[],railbirdBuiltIn:"drillspot-shot",aliases:["drillspot-shot","drill spot-shot","spot shot"],diagram:dc,counters:"progressive",tip:{above:1},confirmTable:!0,prog:{progressive:!0,missKind:"thickthin",noQuality:!0,alternate:["Left side","Right side"],levels:[0,1,2].map(e=>({label:`Level ${e+1}`,cue:["Cue ball two diamonds forward of Level 3 along the same line (measured along the long rail).","Cue ball one diamond forward of Level 3 along the same line.","Cue ball just behind the head string, on the line for an exact 30° cut."][e],diagram:jh(e)})),phases:[{id:"spot",name:"Spot shot",makes:10,outcomes:[{id:"sp-made",label:"Made"}]}]},setup:["Object ball on the foot spot. Cut it into the far bottom corner: an exact 30° cut, a half-ball hit, every time.","Play every shot with the cue tip one tip above center (see the cue ball below), so the cue ball follows the path in the diagram.","Cue ball by level: Level 3 just behind the head string; Level 2 one diamond forward along the same line; Level 1 one diamond further (measured along the long rail).","After a make, switch to the other side of the table (the mirror shot into the other bottom corner). After a miss, repeat the same position until you make it.","Tests committing to a longer shot and a smooth delivery: full routine, fundamentals, stay still through the shot.","Tap each shot, or on a filming day use Railbird's built-in spot-shot drill mode."],target:{text:"10 makes, alternating sides (about 20 shots). Two sets in a row at 80% or better moves you up a level.",minimum:20,unit:"shots"}},{id:"spot-challenge",minutes:15,name:"Spot shot challenge",category:"reps",tags:[{value:"ec-spot-challenge"}],aliases:["spot shot challenge","spot challenge"],diagram:dc,counters:"challenge",challenge:{target:10},tip:{above:1},confirmTable:!0,setup:["The Level 3 spot shot: object ball on the foot spot, cue ball just behind the head string for a 30° cut into the far bottom corner.","Play every shot with the cue tip one tip above center, as in the Progressive spot shot.","Choose the side you start on (the app remembers it). After a make, switch to the other side; after a miss, repeat the same shot until you make it.","Scored: a make is +1 and a miss is −1. The game ends when you reach +10 (you win) or −10. You need runs of makes to finish.","An intermediate to advanced drill: committing to the shot under a little pressure."],target:{text:"Play to +10 or −10.",unit:"shots"}},{id:"mirror",name:"Mirror set",category:"reps",tags:[{value:"ec-mirror"}],aliases:["mirror set"],diagram:Wf,counters:"diagnostic",sides:["L","R"],alternateMakes:!1,tip:{above:.5},blocks:[{id:"M",name:"Mirror set",keys:["make","thick","thin"]}],setup:["Object ball on the head spot; cue ball for a ~10° cut into the left corner, then the mirror for the right.","Alternate left and right, 20-shot blocks, same routine both sides. Cue tip half a tip above center (natural roll), the same hit on both sides, so a thick or thin miss reflects your aim, not spin.","Tallies are optional: tap thick/thin on misses while you use it as a test."],target:{text:"20-shot blocks.",unit:"shots"}},{id:"side-ladder",name:"Side-pocket go / no-go",category:"reps",tags:[{va  90 days Tables All tables 9-ft only 7-ft only −15 −7 0 +8 +15 May 26 Jul Sep Nov frozen Dots: one session, made minus expected in points (bigger = more shots; hollow = un"},{"dest":"progress","title":"Segments you're tracking","text":"Suggested to start: segments whose all-time range clears zero, biggest makes lost or gained first. Remove or add any; the practice plan (step 5) will add its targets here. Right cuts, near-straight 0–20° × +6.1 pts last 90 days · range +1.3"},{"dest":"progress","title":"Drills","text":"Last five sessions against everything before (with fewer than ten sessions, the later half against the earlier). Rep drills use Railbird's record; Transitions use your tapped completions; diagnostic drills use your taps. A drill appears onc"},{"dest":"progress","title":"Stroke check","text":"Nothing stands out in your stroke-drill taps yet. A pattern shows up here after about 8 taps of a kind (misses left or right, drift, spin, thick or thin), and is called clear when it holds up, usually after 25–40."},{"dest":"progress","title":"Journal","text":"Open the Journal The numbered flags on these charts are your journal entries (0 so far): changes to technique or equipment, coach notes, and tally notes."},{"dest":"model","title":"Strengths and weaknesses","text":"Forest plot Radar Established strength Emerging strength Neutral Watch Established weakness Rows run in a fixed order (by angle, distance or pocket) so groups are easy to compare. Bar: all-time difference from expected. Line: 95% range (ses"},{"dest":"model","title":"Shots you own","text":"The kinds of shot you make most reliably, by cut, distance, speed and spin. Each has at least 30 shots over 5 or more sessions, and they're ranked by the make rate you can count on (the low end of its 95% range), so a lucky streak can't top"},{"dest":"model","title":"Speed profile","text":"The speed that makes the most balls at each distance, from the shot model fitted separately for short, medium and long shots, with the shot's geometry held fixed. The shaded columns are the reference speeds (easy 4–7, firm 8–11, hard 12+ mp"},{"dest":"model","title":"Shot predictor","text":"Describe a shot to see how often you'd expect to make it, and which speed gives it the best chance. For attack or safety: attack when this is above your break-even chance (see the routine's shot-selection notes). Object ball → pocket ″ Cue "},{"dest":"model","title":"Make chance by speed for this shot","text":"Shot predictor Describe a shot to see how often you'd expect to make it, and which speed gives it the best chance. For attack or safety: attack when this is above your break-even chance (see the routine's shot-selection notes). Object ball "},{"dest":"model","title":"How the model works","text":"A logistic regression of make or miss on the shot's geometry, fitted on this device from your kept shots. Standard errors are clustered by session, so a few long sessions can't make the estimates look more certain than they are. Pseudo-R² i"},{"dest":"model","title":"Calibration: predicted vs actual, ten equal groups of shots","text":"How the model works A logistic regression of make or miss on the shot's geometry, fitted on this device from your kept shots. Standard errors are clustered by session, so a few long sessions can't make the estimates look more certain than t"},{"dest":"table","title":"Reading a change in the map","text":"Some parts of the table will always be harder to pot from: far from a pocket, or at a steep angle into it. That’s geometry, not a weakness. When a map gets brighter over time, it can mean two different things: you’re potting better from the"},{"dest":"table","title":"How the map is made","text":"Each spot shows the best pocket's chance. Distance to the pocket and approach angle come from the spot; cut angle, cue-ball distance and speed are averaged over your kept shots (or the cut is fixed to the angle you choose). It uses the step"},{"dest":"data","title":"Shots per bin","text":"Shots in view 1,721 Kept 1,720 Made (kept) 71% Median, middle 80% 16° (3.1–40) Kept Excluded by a rule Chart Table  (a percentage above a bar is the share kept, shown where rules removed more than 5%) 0 100 200 300 0 15 30 45 60 75 85 Made,"},{"dest":"data","title":"Made, among kept shots","text":"Shots in view 1,721 Kept 1,720 Made (kept) 71% Median, middle 80% 16° (3.1–40) Kept Excluded by a rule Chart Table Shots per bin (a percentage above a bar is the share kept, shown where rules removed more than 5%) 0 100 200 300 0 15 30 45 6"},{"dest":"routine","title":"Quick card","text":"Stand and read Pocket, speed, spin, where the cue ball goes. See it clearly now, standing. Commit One plan. Feel the ball going down before you get down. Set up Find your aim, however you perceive it, the same way every time. Strokes Soft g"},{"dest":"routine","title":"Standing: reading the shot","text":"Decide everything standing: the pocket, the speed, the spin and where the cue ball should finish. \\"See clearly\\" belongs here, before you commit, not once you are over the ball. Choose speed now. Under pressure, speed is the first thing to d"},{"dest":"routine","title":"Commitment","text":"Feel the ball going down before you get down on the shot. Once you are down, the decision is locked: no re-deciding mid-stroke. If the plan changes while you are down, stand up and start the routine again."},{"dest":"routine","title":"Setting up","text":"Be attentive to your aim, however you perceive it: contact point, ghost ball, fractions, a system or feel. Use the same process on every shot. Walk into the shot on the line you chose, so your body is already aligned when you get down. Chan"},{"dest":"routine","title":"Your numbers","text":"Setting up Be attentive to your aim, however you perceive it: contact point, ghost ball, fractions, a system or feel. Use the same process on every shot. Walk into the shot on the line you chose, so your body is already aligned when you get"},{"dest":"routine","title":"Stroke and delivery","text":"Soft grip, still head, compact but loose. Keep the arm close to the body. When you watch your recordings, look at the misses: does the cue drift, or the arm come away? If side spin creeps in that you didn’t intend, check the backswing first"},{"dest":"routine","title":"Speed","text":"Easy pocket speed (about 4–7 mph): the default for most shots. Firm pocket speed (about 8–11 mph): when you need extra spin or more cue-ball travel. Hard speed (12 mph and up): power shots only; rarely needed. Break: as hard as you can hit "},{"dest":"routine","title":"Quick checks","text":"Stop shot: if the cue ball keeps turning left after it stops, you hit right of center (and the other way round). Film a block in Railbird when something feels off; review the stroke, not just the result."},{"dest":"routine","title":"Shot selection","text":"For most players, object-ball-to-pocket distance matters most to the make chance, then cue-ball distance; cut angle only costs much past about 60°. Your own numbers are below. Long, fairly shallow shots cause more misses than most players e"},{"dest":"routine","title":"Object ball distance to the pocket","text":"Shot selection For most players, object-ball-to-pocket distance matters most to the make chance, then cue-ball distance; cut angle only costs much past about 60°. Your own numbers are below. Long, fairly shallow shots cause more misses than"},{"dest":"routine","title":"Cue ball distance to the object ball","text":"Shot selection For most players, object-ball-to-pocket distance matters most to the make chance, then cue-ball distance; cut angle only costs much past about 60°. Your own numbers are below. Long, fairly shallow shots cause more misses than"},{"dest":"routine","title":"Cut angle","text":"Shot selection For most players, object-ball-to-pocket distance matters most to the make chance, then cue-ball distance; cut angle only costs much past about 60°. Your own numbers are below. Long, fairly shallow shots cause more misses than"},{"dest":"routine","title":"Side pockets: what you actually made, by approach angle","text":"Shot selection For most players, object-ball-to-pocket distance matters most to the make chance, then cue-ball distance; cut angle only costs much past about 60°. Your own numbers are below. Long, fairly shallow shots cause more misses than"},{"dest":"routine","title":"After a miss","text":"Sort the error before the next shot: technique, the decision, or the reaction to the moment. A neutral look, a breath, then the next routine from the top at its normal tempo; do not speed up. One early mistake is one shot; the next shot is "},{"dest":"routine","title":"Table conditions","text":"Fresh cloth plays faster and spin lasts longer: lags die after the far rail with topspin, and two-rail kicks need adjusting. One-rail banks are more consistent on fresh cloth."},{"dest":"routine","title":"On your home screen","text":"The Android app has a home-screen widget with this routine. iPhone home-screen web apps can't have widgets."},{"dest":"visualizer","title":"From behind the cue ball","text":"The cue ball (see-through) over the object ball at contact. The red dot is a center-ball tip. ◀ Cut ° Left Right ▶ Full ¾ ball ½ ball ¼ ball 30° to the right · half-ball · the cue ball covers 50% of the object ball."},{"dest":"visualizer","title":"Lay out a shot","text":"Cue ball Object ball Pocket Choose what to place, then tap the table. Pocket: Head right. Show the contact-point lines Object ball path Cue ball path Contact point line Parallel to the object ball line 13° cut to the right. The dashed circl"},{"dest":"journal","title":"New entry","text":"Date Kind Technique Equipment Coach or chatbot summary Other Entry Add entry"},{"dest":"journal","title":"Share with your coach AI","text":"Prepare a summary One summary any chatbot can read: how to read the numbers, your current picture, statistics from your drill taps, and journal entries with the numbers around them. To bring a reply back, add it above as a “Coach or chatbot"},{"dest":"journal","title":"Share with your coach","text":"Prepare a report A plain-text report for a person: what the numbers clearly show first, then the detail drill by drill, your games and your journal notes."},{"dest":"journal","title":"Entries","text":"No entries yet."},{"dest":"resources","title":"Better with Railbird and poolbilliards.co","text":"Railbird films your play and measures every shot. Electro-Coach works without it, but it’s at its best with it: your Railbird data is what powers the progress tracking, the practice plan, the heat maps and the speed profile. If you’re serio"},{"dest":"resources","title":"Training tools","text":"Railbird railbird.ai Poolbilliards poolbilliards.co"},{"dest":"resources","title":"Instructional channels","text":"Sharivari youtube.com Mr. Cueball youtube.com Jasmin Ouschan youtube.com Niels Feijen youtube.com Margaret Fefilova Styer youtube.com"},{"dest":"resources","title":"Rating system","text":"FargoRate fargorate.com"},{"dest":"resources","title":"Play matches","text":"Salotto salotto.app"},{"dest":"import","title":"How Railbird fits: a companion, not a chore","text":"Film free play. Solo play gives the widest mix of shots, the ones you actually face: run racks of 8-, 9- or 10-ball, play the ghost, or shoot balls in any order. Then watch the recording for one thing in your mechanics to work on. Film a dr"},{"dest":"import","title":"Checks","text":"Import complete: demo-railbird.csv 1,721 new shots from 34 new sessions, May 3, 2026 to Oct 22, 2026. 1,720 added to the analysis, made 71%. Rows in file 1,721 New 1,721 Already stored 0 Kept, all shots 1,720 Excluded from the new shots Imp"},{"dest":"import","title":"Exclusions across all","text":"1,721 stored shots Rule Flagged Only reason Impossible approach angle 1 1 Shots excluded 1 Some shots fail more than one rule, so flags add up to more than the shots excluded."},{"dest":"import","title":"Import history","text":"When File New Updated Kept after Oct 28 10:52 AM demo-railbird.csv 1,721 0 1,720 Show the report for an earlier import demo-railbird.csv — Oct 28, 2026 Import report: demo-railbird.csv 1,721 new shots from 34 new sessions, May 3, 2026 to Oc"},{"dest":"settings","title":"Player profile","text":"You shoot Right-handed Left-handed Vision center The point on your face that has to sit over the cue for a shot to look straight. For most players it’s under one eye; for some it’s in the middle of the face. It matters more in pool than whi"},{"dest":"settings","title":"How to find your vision center","text":"Line up 5 balls on the center line of the table, from the center diamond of the head rail to the center diamond of the foot rail. Lay a cue beside them to check the line is straight. Crouch behind the foot rail with your chin at cue height."},{"dest":"settings","title":"Player stage","text":"Decides which warm-ups and stroke drills the practice plan picks. New players get basic stop shots; advanced players get more follow and draw work. New Developing Advanced Suggested from your stroke drill levels; tap one to choose it yourse"},{"dest":"settings","title":"Appearance","text":"Saved on this device only, so a phone and a laptop can differ. Theme Match the phone Dark Light Chart color (dots, lines, meters) Blue Teal Violet Amber Strengths and weaknesses Green / red Blue / orange (color-blind safe) Table heat map Gr"},{"dest":"settings","title":"Reminders","text":"Reminders are notifications, so they need the Android app."},{"dest":"settings","title":"Anonymous usage counts","text":"Share anonymous usage counts to help decide what to improve. What is and isn't sent Sent: which screens are opened (once each per launch), which features are used (an import, a timed session, a drill tally, a game, the shot clock, a routine"},{"dest":"settings","title":"What is and isn't sent","text":"Sent: which screens are opened (once each per launch), which features are used (an import, a timed session, a drill tally, a game, the shot clock, a routine edit and similar), the app version, the kind of device (Android, iPhone, computer),"},{"dest":"settings","title":"Cleaning rules","text":"These decide which stored shots count. They run over everything you have stored, so changes apply instantly and are reversible. Incomplete record Missing make, cut angle, cue→object or object→pocket distance The shot cannot be placed in the"},{"dest":"settings","title":"This device","text":"Name shown on tallies recorded here"},{"dest":"settings","title":"Backup","text":"Your data lives only on this device. A backup is one file holding every shot (with Railbird's original values), every import report, your tallies, drill layouts, yardstick, notes, plan, bowling games, matches and these settings. Make a back"},{"dest":"settings","title":"Start over","text":"Deletes everything stored on this device. It takes two taps, and nothing is deleted until the second. Delete all data…"},{"dest":"feedback","title":"Request a drill","text":"Tell us about a drill you’d like in the app, with its diagram, tallies and progress tracking: what it’s called, how it’s set up and played, and how you’d score it. Name of the drill How it goes Where it’s from (optional) Send drill request"},{"dest":"feedback","title":"A problem or an idea","text":"Something broken, confusing or missing; a feature you’d use; a drill or screen that could work better. Report a problem Suggest an idea See what others sent"},{"dest":"feedback","title":"How it’s sent","text":"Each button opens a new issue on the project’s GitHub page with the app version filled in. You need a free GitHub account, and what you write there is public, so leave out anything private. Nothing is sent until you press Submit on GitHub."},{"dest":"about","title":"Electro-Coach","text":"web version · updated Oct 28, 2026 A pool practice coach: timed sessions, drills and tallies, your pre-shot routine, a shot clock, straight pool scoring, a journal, and analysis of Railbird shot exports."},{"dest":"about","title":"Why I built it","text":"I love pool, and I built Electro-Coach to help me get better. I wanted to explore my Railbird data in depth and to build a structured practice plan that keeps me honest, with no shortcuts. And the more I use the app, the more it builds on t"},{"dest":"about","title":"What this app is not","text":"There is no substitute for time spent at the table: practicing, competing, getting to know other players and simply having fun. Electro-Coach is here to help you structure your time and improve the quality of your practice, so you get bette"},{"dest":"about","title":"Support Electro-Coach","text":"Electro-Coach isn’t for everyone, but if it helps you, please consider supporting my work. In the interest of full transparency: there may be a subscription option at some point. For now, please enjoy the app while it’s free, and contribute"},{"dest":"about","title":"Updates","text":"The web version updates itself: whenever you open it with a connection, it loads the newest version. This copy is from Oct 28, 2026. Check for updates"},{"dest":"about","title":"Feedback","text":"Feedback is wanted and makes a real difference: problems, ideas and drills you’d like to see. Drill requests are welcome too. Feedback and drill requests"},{"dest":"about","title":"Privacy","text":"Everything you enter stays on this device; there's no account. Backups are files you keep. Anonymous usage counts are off. They show which screens and features get used, never what you enter. If you link your FargoRate, the app asks FargoRa"},{"dest":"about","title":"Better with Railbird and poolbilliards.co","text":"Railbird films your play and measures every shot. Electro-Coach works without it, but it’s at its best with it: your Railbird data is what powers the progress tracking, the practice plan, the heat maps and the speed profile. If you’re serio"},{"dest":"about","title":"How Railbird fits: a companion, not a chore","text":"Film free play. Solo play gives the widest mix of shots, the ones you actually face: run racks of 8-, 9- or 10-ball, play the ghost, or shoot balls in any order. Then watch the recording for one thing in your mechanics to work on. Film a dr"},{"dest":"about","title":"Independent app","text":"Electro-Coach isn't affiliated with, sponsored by or endorsed by Railbird, FargoRate or any of the sites listed in Resources. It reads Railbird's CSV exports and FargoRate's public search."},{"dest":"legal","title":"Electro-Coach privacy","text":"Effective 26 October 2026 The short version. There’s no account. What you enter stays on your device. The app sends a few small, specific requests, listed below, and never sends your shots, scores, notes, routine, profile, names or venues a"},{"dest":"legal","title":"What stays on your device","text":"Electro-Coach privacy Effective 26 October 2026 The short version. There’s no account. What you enter stays on your device. The app sends a few small, specific requests, listed below, and never sends your shots, scores, notes, routine, prof"},{"dest":"legal","title":"What the app sends, and to whom","text":"Electro-Coach privacy Effective 26 October 2026 The short version. There’s no account. What you enter stays on your device. The app sends a few small, specific requests, listed below, and never sends your shots, scores, notes, routine, prof"},{"dest":"legal","title":"Things you choose to share","text":"Electro-Coach privacy Effective 26 October 2026 The short version. There’s no account. What you enter stays on your device. The app sends a few small, specific requests, listed below, and never sends your shots, scores, notes, routine, prof"},{"dest":"legal","title":"Electro-Coach terms of use","text":"Effective 26 October 2026 1. Using the app. Electro-Coach is free for your personal use. The source code is public so you can see how it works, but it isn’t open source: all rights are reserved, so please don’t copy, andrews.github.io/Electro-Coach/",tx={id:"privacy",title:"Electro-Coach privacy",effective:Lm,blocks:[{p:"**The short version.** There’s no account. What you enter stays on your device. The app sends a few small, specific requests, listed below, and never sends your shots, scores, notes, routine, profile, names or venues anywhere."},{h:"What stays on your device",list:["Everything you enter or import: Railbird exports, drill tallies, sessions, games and matches, journal entries, your pre-shot routine, your player profile, settings.","Backups are files you save and keep yourself. Delete everything at any time with **Settings → Delete all data**; uninstalling the Android app does the same."]},{h:"What the app sends, and to whom",list:["**Anonymous usage counts** (Aptabase, a privacy-first analytics service), only if you choose to share them: the app asks when you first open it, and you can change your answer in Settings. They show which screens and features get used, with the app version, the kind of device and the language setting. Aptabase works out the country from the connection and doesn’t store the address. No account, device ID or install ID; nothing you enter.","**Update check** (Android app, GitHub): at most twice a day, the app asks GitHub for the latest release. Nothing about you is sent.","**FargoRate** (only if you link your FargoRate): at most one request a day for your rating, sending only your FargoRate ID, plus any search you make. Switch the daily check off on the FargoRate page.","**The website and the web version** are hosted by GitHub Pages, which keeps standard visitor logs like any website; GitHub’s privacy statement covers those."]},{h:"Things you choose to share",list:["**Feedback** opens a GitHub issue, which is public; you need a GitHub account, and what you post is covered by GitHub’s terms.","**Sharing** your journal or a summary (with a coach, a chatbot or by email) happens only when you tap Share; after that it’s covered by whoever recei
