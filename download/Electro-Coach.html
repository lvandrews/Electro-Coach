ey show which screens and features get used, with the app version, the kind of device and the language setting. Aptabase works out the country from the connection and doesn’t store the address. No account, device ID or install ID; nothing you enter.","**Update check** (Android app, GitHub): at most twice a day, the app asks GitHub for the latest release. Nothing about you is sent.","**FargoRate** (only if you link your FargoRate): at most one request a day for your rating, sending only your FargoRate ID, plus any search you make. Switch the daily check off on the FargoRate page.","**The website and the web version** are hosted by GitHub Pages, which keeps standard visitor logs like any website; GitHub’s privacy statement covers those."]},{h:"Things you choose to share",list:["**Feedback** opens a GitHub issue, which is public; you need a GitHub account, and what you post is covered by GitHub’s terms.","**Sharing** your journal or a summary (with a coach, a chatbot or by email) happens only when you tap Share; after that it’s covered by whoever receives it.","**Support payments**, once there’s a way to contribute, are handled entirely by the payment site (for example Ko-fi). The app never sees card or account details."]},{p:"**Notifications** (Android) are created on the phone: practice reminders, the morning recap and FargoRate changes. Nothing is sent to produce them."},{p:"**Children.** Electro-Coach isn’t aimed at children under 13 and doesn’t knowingly collect anything from them; it collects nothing personal from anyone."},{p:"**Changes.** If this changes, the new version comes with the app update and is noted in the release notes."},{p:"**Questions:** open an issue on the Electro-Coach GitHub page."}]},mv={id:"terms",title:"Electro-Coach terms of use",effective:Ru,blocks:[{p:"**1. Using the app.** Electro-Coach is free for your personal use. The source code is public so you can see how it works, but it isn’t open source: all rights are reserved, so please don’t copy, redistribute or sell it, or publish modified versions."},{p:"**2. As is.** The app is provided as is, without warranties. It’s practice software, not professional coaching or instruction. Numbers from your data are estimates. To the extent the law allows, Lela Andrews isn’t liable for losses from using the app, including lost data, so keep backups."},{p:"**3. Other services.** Railbird, FargoRate, poolbilliards.co and the sites in Resources are independent; Electro-Coach isn’t affiliated with or endorsed by them, and their own terms apply when you use them."},{p:"**4. Your data is yours.** Your entries stay on your device and belong to you."},{p:"**5. Feedback and drill ideas.** If you send suggestions, bug reports or drill requests, you agree they can be used to improve Electro-Coach without payment or obligation. Credit is given where you’d like it and it’s practical."},{p:"**6. Contributions.** Support payments are voluntary gifts to the developer to fund development. They aren’t tax-deductible, aren’t refundable unless the payment site’s rules say otherwise, and don’t buy any features or promises. If a subscription is offered later, it will have its own clearly stated terms, and what’s free when you started won’t be taken away without notice."},{p:"**7. Changes.** These terms may be updated with an app release; continuing to use the app after an update means you accept the new version. Material changes will be noted in the release notes."},{p:"**8. Law.** These terms are governed by the laws of California, USA."}]},Oc=["Electro-Coach isn’t for everyone, but if it helps you, please consider supporting my work.","In the interest of full transparency: there may be a subscription option at some point. For now, please enjoy the app while it’s free, and contribute if you can, in any amount you think is fair. App development takes time and money, so every amount is appreciated. You can give once or set up a monthly contribution.","Thank you so much for your supp
