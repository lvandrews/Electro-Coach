 corner along the diagonal.","Cue ball by level: the center of the table, one diamond further back, or the mirror spot of the object ball.","Sets of 5, 7 or 10 of each: follow (ideally the cue ball follows it in), then stop (within one ball radius; note drift left or right, or an accidental follow or draw), then draw (note a draw back to the rail, or straight into the opposite corner).","Cue tip: follow one and a half tips above center; stop one tip below; draw two tips below.","A miss is repeated until it’s made. It covers all three spins, so it’s the minimum stroke warm-up.","When filming, Railbird's built-in X-shot drill mode still identifies it."],target:{text:"Sets of 5, 7 or 10 makes of each kind (15, 21 or 30 makes).",unit:"makes"}},{id:"center-follow",minutes:6,name:"Center table follow",category:"stroke",tags:[{value:"ec-center-follow"}],aliases:["center table follow"],diagram:Ti(0,"follow"),counters:"progressive",prog:Xo("follow"),tip:{above:2},setup:["One ball on the center spot. Shoot it straight along the diagonal into a corner of your choice and follow the cue ball into the same pocket.","Right-handed players put the cue ball on the left side of the table, left-handed players on the right. Cue ball 1, 2 or 3 diamonds back by level, measured along the long rail.","Note made, followed to the rail, or followed in. Re-spot after each shot; a miss is repeated until it’s made."],target:{text:"Sets of 10 makes.",unit:"makes"}},{id:"center-draw",minutes:6,name:"Center table draw",category:"stroke",tags:[{value:"ec-center-draw"}],aliases:["center table draw","longest shot"],diagram:Ti(0,"draw"),counters:"progressive",prog:Xo("draw"),tip:{above:-2},setup:["One ball on the center spot. Shoot it straight along the diagonal into a corner of your choice and draw the cue ball straight back to the opposite corner.","Right-handed players put the cue ball on the left side of the table, left-handed players on the right. Cue ball 1, 2 or 3 diamonds back by level, measured along the long rail. Level 3 is quite advanced.","Note made, drawn back to the rail, or drawn into the corner (it must go in). Re-spot after each shot; a miss is repeated until it’s made."],target:{text:"Sets of 10 makes.",unit:"makes"}}],wf=[...vf,...kf,{id:"transitions-1",name:"Transitions-1",category:"transitions",tags:[{value:"ec-transitions-1"}],aliases:["pool kata bassai 9 ball","pool kata","kata"],diagram:null,editableLayout:!0,counters:"completion",ballsPerRack:9,learning:Hl,tip:{label:"First shot",right:1.25},setup:["1 on the right rail and 2 on the left rail, each at the second diamond beside the head spot; 3 at the middle diamond of the head rail; 4 on the head spot.","5 on the right rail and 7 on the left rail, each at the second diamond beside the foot spot; 6 at the middle diamond of the foot rail; 8 on the foot spot; 9 on the center spot.","Rail balls one ball-width off the cushion. Cue ball 1½ balls uptable of the 9. First shot: cue tip one and a quarter tips right of center.","Several ways to complete it, using different transitions from each ball to the next. Focus: fine-tune position with slightly more or less spin on chosen shots."],target:{text:"Log every rack: completed, or the ball where the run ended.",unit:"racks"}},{id:"ghost-8",minutes:25,name:"8-ball progressive ghost",category:"runout",tags:[{value:"ec-ghost-8"}],aliases:["8 ball ghost","8-ball ghost","progressive ghost 8"],diagram:pf,counters:"ghost",ghost:{game:"8-ball",balls:15,minLevel:3,maxLevel:8},setup:["Rack all fifteen and break. Tap the balls that went in on the break, then pick your group.","Below level 8, take balls of your group off the table (your choice) until only the level’s number are left to run, the 8 included. The other group stays on as obstacles.","Run out: tap each ball as you pocket it. If you miss, or get hopelessly out of line, tap that ball and re-rack.","No hero shots: play the shots you’d play in a match. Level up at 80% run-outs over your last 10 racks; drop a level below 60%."],target:{text:"Play as many racks as you have time for: a rack can take under 10 minutes, and 20–40 minutes is typical in a workout (longer is fine). Ten racks at a level before it can move you up or down.",unit:"racks"}},{id:"ghost-9",minutes:25,name:"9-ball progressive ghost",category:"runout",tags:[{value:"ec-ghost-9"}],aliases:["9 ball ghost","9-ball ghost","progressive ghost 9","playing the ghost"],diagram:hf,counters:"ghost",ghost:{game:"9-ball",balls:9,minLevel:3,maxLevel:9},setup:["Rack nine and break. Tap the balls that went in on the break (it’s fine if none did: the break count shows your break quality).","Below level 9, take balls off the table (your choice, never the 9) until only the level’s number are left. At level 3 you run three balls; at level 9, the whole rack.","Run them in order. If you miss, or get hopelessly out of line, tap that ball and re-rack.","No hero shots: play the shots you’d play in a match. Level up at 80% run-outs over your last 10 racks; drop a level below 60%."],target:{text:"Play as many racks as you have time for: a rack can take under 10 minutes, and 20–40 minutes is typical in a workout (longer is fine). Ten racks at a level before it can move you up or down.",unit:"racks"}},{id:"bowling-10",minutes:75,name:"10-ball bowling",category:"runout",tags:[{value:"ec-10ball-bowling"}],aliases:["10 ball bowling","10-ball bowling","bowliards"],diagram:cf,counters:"none",scorer:"bowling",setup:[ph,"Rack ten balls and break. Each frame is one rack, with two innings to clear it.","All ten in the first inning is a strike (10 plus your next two innings); all ten across both innings is a spare (10 plus your next inning). The tenth frame earns its bonus innings. 300 is perfect.","Play your usual rules for the break and ball in hand; the scorer only needs the balls you ran in each inning.","An offensive drill: it measures how far you get through a rack, so run-out planning and position decide it."],target:{text:"One full game each time (60–90 minutes). Score it with the scorer (Open the scorer below) and watch the average of your last five.",unit:"racks"}},{id:"spot",minutes:8,name:"Progressive spot shot",category:"reps",tags:[],railbirdBuiltIn:"drillspot-shot",aliases:["drillspot-shot","drill spot-shot","spot shot"],diagram:zo,counters:"progressive",tip:{above:1},confirmTable:!0,prog:{progressive:!0,missKind:"thickthin",noQuality:!0,alternate:["Left side","Right side"],levels:[0,1,2].map(e=>({label:`Level ${e+1}`,cue:["Cue ball two diamonds forward of Level 3 along the same line (measured along the long rail).","Cue ball one diamond forward of Level 3 along the same line.","Cue ball just behind the head string, on the line for an exact 30° cut."][e],diagram:fh(e)})),phases:[{id:"spot",name:"Spot shot",makes:10,outcomes:[{id:"sp-made",label:"Made"}]}]},setup:["Object ball on the foot spot. Cut it into the far bottom corner: an exact 30° cut, a half-ball hit, every time.","Play every shot with the cue tip one tip above center (see the cue ball below), so the cue ball follows the path in the diagram.","Cue ball by level: Level 3 just behind the head string; Level 2 one diamond forward along the same line; Level 1 one diamond further (measured along the long rail).","After a make, switch to the other side of the table (the mirror shot into the other bottom corner). After a miss, repeat the same position until you make it.","Tests committing to a longer shot and a smooth delivery: full routine, fundamentals, stay still through the shot.","Tap each shot, or on a filming day use Railbird's built-in spot-shot drill mode."],target:{text:"10 makes, alternating sides (about 20 shots). Two sets in a row at 80% or better moves you up a level.",minimum:20,unit:"shots"}},{id:"spot-challenge",minutes:15,name:"Spot shot challenge",category:"reps",tags:[{value:"ec-spot-challenge"}],aliases:["spot shot challenge","spot challenge"],diagram:zo,counters:"challenge",challenge:{target:10},tip:{above:1},confirmTable:!0,setup:["The Level 3 spot shot: object ball on the foot spot, cue ball just behind the head string for a 30° cut into the far bottom corner.","Play every shot with the cue tip one tip above center, as in the Progressive spot shot.","Choose the side you start on (the app remembers it). After a make, switch to the other side; after a miss, repeat the same shot until you make it.","Scored: a make is +1 and a miss is −1. The game ends when you reach +10 (you win) or −10. You need runs of makes to finish.","An intermediate to advanced drill: committing to the shot under a little pressure."],target:{text:"Play to +10 or −10.",unit:"shots"}},{id:"mirror",name:"Mirror set",category:"reps",tags:[{value:"ec-mirror"}],aliases:["mirror set"],diagram:rf,counters:"diagnostic",sides:["L","R"],alternateMakes:!1,blocks:[{id:"M",name:"Mirror set",keys:["make","thick","thin"]}],setup:["Object ball on the head spot; cue ball for a ~10° cut into the left corner, then the mirror for the right.","Alternate left and right, 20-shot blocks, same routine both sides.","Tallies are optional: tap thick/thin on misses while you use it as a test."],target:{text:"20-shot blocks.",unit:"shots"}},{id:"side-ladder",name:"Side-pocket go / no-go",category:"reps",tags:[{value:"ec-side-ladder"}],aliases:[],diagram:lf,counters:"none",setup:["Object ball 1½ diamonds from the side pocket at 0°, 20°, 40°, 50°, 60° approach; cue ball 1 diamond straight behind.","5 per angle. Past the line, play the corner or a safety."],target:{text:"5 shots per angle.",perCell:5,unit:"shots"}},{id:"squirt",minutes:10,name:"Stop shots with spin",category:"stroke",tags:[{value:"ec-squirt"}],aliases:["squirt calibration","squirt"],diagram:mh(0),counters:"progressive",prog:ef,tip:[{for:"sl",label:"Left spin",right:-1},{for:"sr",label:"Right spin",right:1}],setup:["Straight in to a corner: object ball 2 diamonds from the pocket, cue ball 1, 2 or 3 diamonds straight back by level. Right-handed players shoot from the  count on (the low end of its 95% range), so a lucky streak can't top"},{"dest":"model","title":"Speed profile","text":"The speed that makes the most balls at each distance, from the shot model fitted separately for short, medium and long shots, with the shot's geometry held fixed. The shaded columns are the reference speeds (easy 4–7, firm 8–11, hard 12+ mp"},{"dest":"model","title":"Shot predictor","text":"Describe a shot to see how often you'd expect to make it, and which speed gives it the best chance. For attack or safety: attack when this is above your break-even chance (see the routine's shot-selection notes). Object ball → pocket ″ Cue "},{"dest":"model","title":"Make chance by speed for this shot","text":"Shot predictor Describe a shot to see how often you'd expect to make it, and which speed gives it the best chance. For attack or safety: attack when this is above your break-even chance (see the routine's shot-selection notes). Object ball "},{"dest":"model","title":"How the model works","text":""},{"dest":"model","title":"Calibration: predicted vs actual, ten equal groups of shots","text":"How the model works"},{"dest":"table","title":"Reading a change in the map","text":""},{"dest":"table","title":"How the map is made","text":""},{"dest":"data","title":"Shots per bin","text":"Shots in view 7,297 Kept 6,957 Made (kept) 66% Median, middle 80% 18° (1.2–48) Kept Excluded by a rule Chart Table  (a percentage above a bar is the share kept, shown where rules removed more than 5%) 0 500 1K 1.5K 2K 0% 0 15 30 45 60 75 ≥9"},{"dest":"data","title":"Made, among kept shots","text":"Shots in view 7,297 Kept 6,957 Made (kept) 66% Median, middle 80% 18° (1.2–48) Kept Excluded by a rule Chart Table Shots per bin (a percentage above a bar is the share kept, shown where rules removed more than 5%) 0 500 1K 1.5K 2K 0% 0 15 3"},{"dest":"routine","title":"Quick card","text":"Stand and read Pocket, speed, spin, where the cue ball goes. See it clearly now, standing. Commit One plan. Feel the ball going down before you get down. Set up Find your aim, however you perceive it, the same way every time. Strokes Soft g"},{"dest":"routine","title":"Standing: reading the shot","text":""},{"dest":"routine","title":"Commitment","text":""},{"dest":"routine","title":"Setting up","text":""},{"dest":"routine","title":"Your numbers","text":"Setting up"},{"dest":"routine","title":"Stroke and delivery","text":""},{"dest":"routine","title":"Speed","text":""},{"dest":"routine","title":"Quick checks","text":""},{"dest":"routine","title":"Shot selection","text":""},{"dest":"routine","title":"Object ball distance to the pocket","text":"Shot selection"},{"dest":"routine","title":"Cue ball distance to the object ball","text":"Shot selection"},{"dest":"routine","title":"Cut angle","text":"Shot selection"},{"dest":"routine","title":"Side pockets: what you actually made, by approach angle","text":"Shot selection"},{"dest":"routine","title":"After a miss","text":""},{"dest":"routine","title":"Table conditions","text":""},{"dest":"routine","title":"On your home screen","text":"The Android app has a home-screen widget with this routine. iPhone home-screen web apps can't have widgets."},{"dest":"journal","title":"New entry","text":"Date Kind Technique Equipment Coach or chatbot summary Other Entry Add entry"},{"dest":"journal","title":"Share with your coach AI","text":"Prepare a summary One summary any chatbot can read: how to read the numbers, your current picture, statistics from your drill taps, and journal entries with the numbers around them. To bring a reply back, add it above as a “Coach or chatbot"},{"dest":"journal","title":"Share with your coach","text":"Prepare a report A plain-text report for a person: what the numbers clearly show first, then the detail drill by drill, your games and your journal notes."},{"dest":"journal","title":"Entries","text":"No entries yet."},{"dest":"resources","title":"Better with Railbird and poolbilliards.co","text":"Railbird films your play and measures every shot. Electro-Coach works without it, but it’s at its best with it: your Railbird data is what powers the progress tracking, the practice plan, the heat maps and the speed profile. If you’re serio"},{"dest":"resources","title":"Training tools","text":"Railbird railbird.ai Poolbilliards poolbilliards.co"},{"dest":"resources","title":"Instructional channels","text":"Sharivari youtube.com Mr. Cueball youtube.com Jasmin Ouschan youtube.com Niels Feijen youtube.com Margaret Fefilova Styer youtube.com"},{"dest":"resources","title":"Rating system","text":"FargoRate fargorate.com"},{"dest":"resources","title":"Play matches","text":"Salotto salotto.app"},{"dest":"import","title":"How Railbird fits: a companion, not a chore","text":""},{"dest":"import","title":"Checks","text":"Import complete: all-time.csv 7,297 new shots from 143 new sessions, Jan 12, 2025 to Oct 16, 2026. 6,957 added to the analysis, made 66%. Rows in file 7,297 New 7,297 Already stored 0 Kept, all shots 6,957 Excluded from the new shots Implau"},{"dest":"import","title":"Exclusions across all","text":"7,297 stored shots"},{"dest":"import","title":"Import history","text":"When File New Updated Kept after Oct 27 11:48 PM all-time.csv 7,297 0 6,957 Show the report for an earlier import"},{"dest":"settings","title":"Player profile","text":"You shoot Right-handed Left-handed Vision center The point on your face that has to sit over the cue for a shot to look straight. For most players it’s under one eye; for some it’s in the middle of the face. It matters more in pool than whi"},{"dest":"settings","title":"How to find your vision center","text":""},{"dest":"settings","title":"Player stage","text":"Decides which warm-ups and stroke drills the practice plan picks. New players get basic stop shots; advanced players get more follow and draw work. New Developing Advanced Suggested from your stroke drill levels; tap one to choose it yourse"},{"dest":"settings","title":"Appearance","text":"Saved on this device only, so a phone and a laptop can differ. Theme Match the phone Dark Light Chart color (dots, lines, meters) Blue Teal Violet Amber Strengths and weaknesses Green / red Blue / orange (color-blind safe) Table heat map Gr"},{"dest":"settings","title":"Reminders","text":"Reminders are notifications, so they need the Android app."},{"dest":"settings","title":"Anonymous usage counts","text":"Share anonymous usage counts to help decide what to improve. What is and isn't sent"},{"dest":"settings","title":"What is and isn't sent","text":""},{"dest":"settings","title":"Cleaning rules","text":"These decide which stored shots count. They run over everything you have stored, so changes apply instantly and are reversible. Incomplete record Missing make, cut angle, cue→object or object→pocket distance The shot cannot be placed in the"},{"dest":"settings","title":"This device","text":"Name shown on tallies recorded here"},{"dest":"settings","title":"Backup","text":"Your data lives only on this device. A backup is one file holding every shot (with Railbird's original values), every import report, your tallies, drill layouts, yardstick, notes, plan, bowling games, matches and these settings. Make a back"},{"dest":"settings","title":"Start over","text":"Deletes everything stored on this device. It takes two taps, and nothing is deleted until the second. Delete all data…"},{"dest":"feedback","title":"Request a drill","text":"Tell us about a drill you’d like in the app, with its diagram, tallies and progress tracking: what it’s called, how it’s set up and played, and how you’d score it. Name of the drill How it goes Where it’s from (optional) Send drill request"},{"dest":"feedback","title":"A problem or an idea","text":"Something broken, confusing or missing; a feature you’d use; a drill or screen that could work better. Report a problem Suggest an idea See what others sent"},{"dest":"feedback","title":"How it’s sent","text":"Each button opens a new issue on the project’s GitHub page with the app version filled in. You need a free GitHub account, and what you write there is public, so leave out anything private. Nothing is sent until you press Submit on GitHub."},{"dest":"about","title":"Electro-Coach","text":"web version · updated Oct 27, 2026 A pool practice coach: timed sessions, drills and tallies, your pre-shot routine, a shot clock, straight pool scoring, a journal, and analysis of Railbird shot exports."},{"dest":"about","title":"Why I built it","text":"I love pool, and I built Electro-Coach to help me get better. I wanted to explore my Railbird data in depth and to build a structured practice plan that keeps me honest, with no shortcuts. And the more I use the app, the more it builds on t"},{"dest":"about","title":"Support Electro-Coach","text":"Electro-Coach isn’t for everyone, but if it helps you, please consider supporting my work. In the interest of full transparency: there may be a subscription option at some point. For now, please enjoy the app while it’s free, and contribute"},{"dest":"about","title":"Updates","text":"The web version updates itself: whenever you open it with a connection, it loads the newest version. This copy is from Oct 27, 2026. Check for updates"},{"dest":"about","title":"Feedback","text":"Feedback is wanted and makes a real difference: problems, ideas and drills you’d like to see. Drill requests are welcome too. Feedback and drill requests"},{"dest":"about","title":"Privacy","text":"Everything you enter stays on this device; there's no account. Backups are files you keep. Anonymous usage counts are off. They show which screens and features get used, never what you enter. If you link your FargoRate, the app asks FargoRa"},{"dest":"about","title":"Better with Railbird and poolbilliards.co","text":"Railbird films your play and measures every shot. Electro-Coach works without it, but it’s at its best with it: your Railbird data is what powers the progress tracking, the practice plan, the heat maps and the speed profile. If you’re serio"},{"dest":"about","title":"How Railbird fits: a companion, not a chore","text":""},{"dest":"about","title":"Independent app","text":"Electro-Coach isn't affiliated with, sponsored by or endorsed by Railbird, FargoRate or any of the sites listed in Resources. It reads Railbird's CSV exports and FargoRate's public search."},{"dest":"legal","title":"Electro-Coach privacy","text":"Effective 26 October 2026 The short version. There’s no account. What you enter stays on your device. The app sends a few small, specific requests, listed below, and never sends your shots, scores, notes, routine, profile, names or venues a"},{"dest":"legal","title":"What stays on your device","text":"Electro-Coach privacy Effective 26 October 2026 The short version. There’s no account. What you enter stays on your device. The app sends a few small, specific requests, listed below, and never sends your shots, scores, notes, routine, prof"},{"dest":"legal","title":"What the app sends, and to whom","text":"Electro-Coach privacy Effective 26 October 2026 The short version. There’s no account. What you enter stays on your device. The app sends a few small, specific requests, listed below, and never sends your shots, scores, notes, routine, prof"},{"dest":"legal","title":"Things you choose to share","text":"Electro-Coach privacy Effective 26 October 2026 The short version. There’s no account. What you enter stays on your device. The app sends a few small, specific requests, listed below, and never sends your shots, scores, notes, routine, prof"},{"dest":"legal","title":"Electro-Coach terms of use","text":"Effective 26 October 2026 1. Using the app. Electro-Coach is free for your personal use. The source code is public so you can see how it works, but it isn’t open source: all rights are reserved, so please don’t copy, redistribute or sell it"}]`),Cd=Pw.map(e=>({...e,d:nn.find(n=>n.id===e.dest)})).filter(e=>!!e.d),Td=e=>e.toLowerCase().normalize("NFKD time with **Settings → Delete all data**; uninstalling the Android app does the same."]},{h:"What the app sends, and to whom",list:["**Anonymous usage counts** (Aptabase, a privacy-first analytics service), only if you choose to share them: the app asks when you first open it, and you can change your answer in Settings. They show which screens and features get used, with the app version, the kind of device and the language setting. Aptabase works out the country from the connection and doesn’t store the address. No account, device ID or install ID; nothing you enter.","**Update check** (Android app, GitHub): at most twice a day, the app asks GitHub for the latest release. Nothing about you is sent.","**FargoRate** (only if you link your FargoRate): at most one request a day for your rating, sending only your FargoRate ID, plus any search you make. Switch the daily check off on the FargoRate page.","**The website and the web version** are hosted by GitHub Pages, which keeps standard visitor logs like any website; GitHub’s privacy statement covers those."]},{h:"Things you choose to share",list:["**Feedback** opens a GitHub issue, which is public; you need a GitHub account, and what you post is covered by GitHub’s terms.","**Sharing** your journal or a summary (with a coach, a chatbot or by email) happens only when you tap Share; after that it’s covered by whoever receives it.","**Support payments**, once there’s a way to contribute, are handled entirely by the payment site (for example Ko-fi). The app never sees card or account details."]},{p:"**Notifications** (Android) are created on the phone: practice reminders, the morning recap and FargoRate changes. Nothing is sent to produce them."},{p:"**Children.** Electro-Coach isn’t aimed at children under 13 and doesn’t knowingly collect anything from them; it collects nothing personal from anyone."},{p:"**Changes.** If this changes, the new version comes with the app update and is noted in the release notes."},{p:"**Questions:** open an issue on the Electro-Coach GitHub page."}]},l1={id:"terms",title:"Electro-Coach terms of use",effective:Kp,blocks:[{p:"**1. Using the app.** Electro-Coach is free for your personal use. The source code is public so you can see how it works, but it isn’t open source: all rights are reserved, so please don’t copy, redistribute or sell it, or publish modified versions."},{p:"**2. As is.** The app is provided as is, without warranties. It’s practice software, not professional coaching or instruction. Numbers from your data are estimates. To the extent the law allows, Lela Andrews isn’t liable for losses from using the app, including lost data, so keep backups."},{p:"**3. Other services.** Railbird, FargoRate, poolbilliards.co and the sites in Resources are independent; Electro-Coach isn’t affiliated with or endorsed by them, and their own terms apply when you use them."},{p:"**4. Your data is yours.** Your entries stay on your device and belong to you."},{p:"**5. Feedback and drill ideas.** If you send suggestions, bug reports or drill requests, you agree they can be used to improve Electro-Coach without payment or obligation. Credit is given where you’d like it and it’s practical."},{p:"**6. Contributions.** Support payments are voluntary gifts to the developer to fund development. They aren’t tax-deductible, aren’t refundable unless the payment site’s rules say otherwise, and don’t buy any features or promises. If a subscription is offered later, it will have its own clearly stated terms, and what’s free when you started won’t be taken away without notice."},{p:"**7. Changes.** These terms may be updated with an app release; continuing to use the app after an update means you accept the new version. Material changes will be noted in the release notes."},{p:"**8. Law.** These terms are governed by the laws of California, USA."}]},Wd=["Electro-Coach isn’t for everyone, but if it helps you, please consider supporting my work.","In the interest of full tr
