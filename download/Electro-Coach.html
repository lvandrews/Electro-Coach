 take under 10 minutes, and 20–40 minutes is typical in a workout (longer is fine). Ten racks at a level before it can move you up or down.",unit:"racks"}},{id:"ghost-9",minutes:25,name:"9-ball progressive ghost",category:"runout",tags:[{value:"ec-ghost-9"}],aliases:["9 ball ghost","9-ball ghost","progressive ghost 9","playing the ghost"],diagram:Gm,counters:"ghost",ghost:{game:"9-ball",balls:9,minLevel:3,maxLevel:9},setup:["Rack nine and break. Tap the balls that went in on the break (it’s fine if none did: the break count shows your break quality).","Below level 9, take balls off the table (your choice, never the 9) until only the level’s number are left. At level 3 you run three balls; at level 9, the whole rack.","Run them in order. If you miss, or get hopelessly out of line, tap that ball and re-rack.","No hero shots: play the shots you’d play in a match. Level up at 80% run-outs over your last 10 racks; drop a level below 60%."],target:{text:"Play as many racks as you have time for: a rack can take under 10 minutes, and 20–40 minutes is typical in a workout (longer is fine). Ten racks at a level before it can move you up or down.",unit:"racks"}},{id:"bowling-10",minutes:75,name:"10-ball bowling",category:"runout",tags:[{value:"ec-10ball-bowling"}],aliases:["10 ball bowling","10-ball bowling","bowliards"],diagram:Um,counters:"none",scorer:"bowling",setup:[Xd,"Rack ten balls and break. Each frame is one rack, with two innings to clear it.","All ten in the first inning is a strike (10 plus your next two innings); all ten across both innings is a spare (10 plus your next inning). The tenth frame earns its bonus innings. 300 is perfect.","Play your usual rules for the break and ball in hand; the scorer only needs the balls you ran in each inning.","An offensive drill: it measures how far you get through a rack, so run-out planning and position decide it."],target:{text:"One full game each time (60–90 minutes). Score it with the scorer (Open the scorer below) and wa plan. Feel the ball going down before you get down. Set up Find your aim, however you perceive it, the same way every time. Strokes Soft g"},{"dest":"routine","title":"Standing: reading the shot","text":""},{"dest":"routine","title":"Commitment","text":""},{"dest":"routine","title":"Setting up","text":""},{"dest":"routine","title":"Your numbers","text":"Setting up"},{"dest":"routine","title":"Stroke and delivery","text":""},{"dest":"routine","title":"Speed","text":""},{"dest":"routine","title":"Quick checks","text":""},{"dest":"routine","title":"Shot selection","text":""},{"dest":"routine","title":"Object ball distance to the pocket","text":"Shot selection"},{"dest":"routine","title":"Cue ball distance to the object ball","text":"Shot selection"},{"dest":"routine","title":"Cut angle","text":"Shot selection"},{"dest":"routine","title":"Side pockets: what you actually made, by approach angle","text":"Shot selection"},{"dest":"routine","title":"After a miss","text":""},{"dest":"routine","title":"Table conditions","text":""},{"dest":"routine","title":"On your home screen","text":"The Android app has a home-screen widget with this routine. iPhone home-screen web apps can't have widgets."},{"dest":"journal","title":"New entry","text":"Date Kind Technique Equipment Coach or chatbot summary Other Entry Add entry"},{"dest":"journal","title":"Share with your coach AI","text":"Prepare a summary One summary any chatbot can read: how to read the numbers, your current picture, statistics from your drill taps, and journal entries with the numbers around them. To bring a reply back, add it above as a “Coach or chatbot"},{"dest":"journal","title":"Share with your coach","text":"Prepare a report A plain-text report for a person: what the numbers clearly show first, then the detail drill by drill, your games and your journal notes."},{"dest":"journal","title":"Entries","text":"No entries yet."},{"dest":"resources","title":"Better with Railbird and poolbilliards.co","text":"Railbird films your play and measures every shot. Electro-Coach works without it, but it’s at its best with it: your Railbird data is what powers the progress tracking, the practice plan, the heat maps and the speed profile. If you’re serio"},{"dest":"resources","title":"Training tools","text":"Railbird railbird.ai Poolbilliards poolbilliards.co"},{"dest":"resources","title":"Instructional channels","text":"Sharivari youtube.com Mr. Cueball youtube.com Jasmin Ouschan youtube.com Niels Feijen youtube.com Margaret Fefilova Styer youtube.com"},{"dest":"resources","title":"Rating system","text":"FargoRate fargorate.com"},{"dest":"resources","title":"Play matches","text":"Salotto salotto.app"},{"dest":"import","title":"How Railbird fits: a companion, not a chore","text":""},{"dest":"import","title":"Checks","text":"Import complete: all-time.csv 7,297 new shots from 143 new sessions, Jan 12, 2025 to Oct 16, 2026. 6,957 added to the analysis, made 66%. Rows in file 7,297 New 7,297 Already stored 0 Kept, all shots 6,957 Excluded from the new shots Implau"},{"dest":"import","title":"Exclusions across all","text":"7,297 stored shots"},{"dest":"import","title":"Import history","text":"When File New Updated Kept after Oct 27 12:12 PM all-time.csv 7,297 0 6,957 Show the report for an earlier import"},{"dest":"settings","title":"Player profile","text":"You shoot Right-handed Left-handed Dominant eye Right Left Center (neither) Don’t know How to check Games you mostly play 8-ball 9-ball 10-ball Straight pool One-pocket Subscriptions I subscribe to Railbird I subscribe to poolbilliards.co F"},{"dest":"settings","title":"How to check","text":""},{"dest":"settings","title":"Player stage","text":"Decides which warm-ups and stroke drills the practice plan picks. New players get basic stop shots; advanced players get more follow and draw work. New Developing Advanced Suggested from your stroke drill levels; tap one to choose it yourse"},{"dest":"settings","title":"Appearance","text":"Saved on this device only, so a phone and a laptop can differ. Theme Match the phone Dark Light Chart color (dots, lines, meters) Blue Teal Violet Amber Strengths and weaknesses Green / red Blue / orange (color-blind safe) Table heat map Gr"},{"dest":"settings","title":"Reminders","text":"Reminders are notifications, so they need the Android app."},{"dest":"settings","title":"Anonymous usage counts","text":"Share anonymous usage counts to help decide what to improve. What is and isn't sent"},{"dest":"settings","title":"What is and isn't sent","text":""},{"dest":"settings","title":"Cleaning rules","text":"These decide which stored shots count. They run over everything you have stored, so changes apply instantly and are reversible. Incomplete record Missing make, cut angle, cue→object or object→pocket distance The shot cannot be placed in the"},{"dest":"settings","title":"This device","text":"Name shown on tallies recorded here"},{"dest":"settings","title":"Backup","text":"Your data lives only on this device. A backup is one file holding every shot (with Railbird's original values), every import report, your tallies, drill layouts, yardstick, notes, plan, bowling games, matches and these settings. Make a back"},{"dest":"settings","title":"Start over","text":"Deletes everything stored on this device. It takes two taps, and nothing is deleted until the second. Delete all data…"},{"dest":"feedback","title":"Request a drill","text":"Tell us about a drill you’d like in the app, with its diagram, tallies and progress tracking: what it’s called, how it’s set up and played, and how you’d score it. Name of the drill How it goes Where it’s from (optional) Send drill request"},{"dest":"feedback","title":"A problem or an idea","text":"Something broken, confusing or missing; a feature you’d use; a drill or screen that could work better. Report a problem Suggest an idea See what others sent"},{"dest":"feedback","title":"How it’s sent","text":"Each button opens a new issue on the project’s GitHub page with the app version filled in. You need a free GitHub account, and what you write there is public, so leave out anything private. Nothing is sent until you press Submit on GitHub."},{"dest":"about","title":"Electro-Coach","text":"web version · updated Oct 27, 2026 A pool practice coach: timed sessions, drills and tallies, your pre-shot routine, a shot clock, straight pool scoring, a journal, and analysis of Railbird shot exports."},{"dest":"about","title":"Why I built it","text":"I love pool, and I built Electro-Coach to help me get better. I wanted to explore my Railbird data in depth and to build a structured practice plan that keeps me honest, with no shortcuts. And the more I use the app, the more it builds on t"},{"dest":"about","title":"Support Electro-Coach","text":"Electro-Coach isn’t for everyone, but if it helps you, please consider supporting my work. In the interest of full transparency: there may be a subscription option at some point. For now, please enjoy the app while it’s free, and contribute"},{"dest":"about","title":"Updates","text":"The web version updates itself: whenever you open it with a connection, it loads the newest version. This copy is from Oct 27, 2026. Check for updates"},{"dest":"about","title":"Feedback","text":"Feedback is wanted and makes a real difference: problems, ideas and drills you’d like to see. Drill requests are welcome too. Feedback and drill requests"},{"dest":"about","title":"Privacy","text":"Everything you enter stays on this device; there's no account. Backups are files you keep. Anonymous usage counts are off. They show which screens and features get used, never what you enter. If you link your FargoRate, the app asks FargoRa"},{"dest":"about","title":"Better with Railbird and poolbilliards.co","text":"Railbird films your play and measures every shot. Electro-Coach works without it, but it’s at its best with it: your Railbird data is what powers the progress tracking, the practice plan, the heat maps and the speed profile. If you’re serio"},{"dest":"about","title":"How Railbird fits: a companion, not a chore","text":""},{"dest":"about","title":"Independent app","text":"Electro-Coach isn't affiliated with, sponsored by or endorsed by Railbird, FargoRate or any of the sites listed in Resources. It reads Railbird's CSV exports and FargoRate's public search."},{"dest":"legal","title":"Electro-Coach privacy","text":"Effective 26 October 2026 The short version. There’s no account. What you enter stays on your device. The app sends a few small, specific requests, listed below, and never sends your shots, scores, notes, routine, profile, names or venues a"},{"dest":"legal","title":"What stays on your device","text":"Electro-Coach privacy Effective 26 October 2026 The short version. There’s no account. What you enter stays on your device. The app sends a few small, specific requests, listed below, and never sends your shots, scores, notes, routine, prof"},{"dest":"legal","title":"What the app sends, and to whom","text":"Electro-Coach privacy Effective 26 October 2026 The short version. There’s no account. What you enter stays on your device. The app sends a few small, specific requests, listed below, and never sends your shots, scores, notes, routine, prof"},{"dest":"legal","title":"Things you choose to share","text":"Electro-Coach privacy Effective 26 October 2026 The short version. There’s no account. What you enter stays on your device. The app sends a few small, specific requests, listed below, and never sends your shots, scores, notes, routine, prof"},{"dest":"legal","title":"Electro-Coach terms of use","text":"Effective 26 October 2026 1. Using the app. Electro-Coach is free for your personal use. The source code is public so you can see how it works, but it isn’t open source: all rights are reserved, so please don’t copy, redistribute or sell it"}]`),hd=pw.map(e=>({...e,d:Xt.find(n=>n.id===e.dest)})).filter(e=>!!e.d),ud=e=>e.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/ gs → Delete all data**; uninstalling the Android app does the same."]},{h:"What the app sends, and to whom",list:["**Anonymous usage counts** (Aptabase, a privacy-first analytics service), only if you choose to share them: the app asks when you first open it, and you can change your answer in Settings. They show which screens and features get used, with the app version, the kind of device and the language setting. Aptabase works out the country from the connection and doesn’t store the address. No account, device ID or install ID; nothing you enter.","**Update check** (Android app, GitHub): at most twice a day, the app asks GitHub for the latest release. Nothing about you is sent.","**FargoRate** (only if you link your FargoRate): at most one request a day for your rating, sending only your FargoRate ID, plus any search you make. Switch the daily check off on the FargoRate page.","**The website and the web version** are hosted by GitHub Pages, which keeps standard visitor logs like any website; GitHub’s privacy statement covers those."]},{h:"Things you choose to share",list:["**Feedback** opens a GitHub issue, which is public; you need a GitHub account, and what you post is covered by GitHub’s terms.","**Sharing** your journal or a summary (with a coach, a chatbot or by email) happens only when you tap Share; after that it’s covered by whoever receives it.","**Support payments**, once there’s a way to contribute, are handled entirely by the payment site (for example Ko-fi). The app never sees card or account details."]},{p:"**Notifications** (Android) are created on the phone: practice reminders, the morning recap and FargoRate changes. Nothing is sent to produce them."},{p:"**Children.** Electro-Coach isn’t aimed at children under 13 and doesn’t knowingly collect anything from them; it collects nothing personal from anyone."},{p:"**Changes.** If this changes, the new version comes with the app update and is noted in the release notes."},{p:"**Questions:** open an issue on the Electro-Coach GitHub page."}]},Pw={id:"terms",title:"Electro-Coach terms of use",effective:Mp,blocks:[{p:"**1. Using the app.** Electro-Coach is free for your personal use. The source code is public so you can see how it works, but it isn’t open source: all rights are reserved, so please don’t copy, redistribute or sell it, or publish modified versions."},{p:"**2. As is.** The app is provided as is, without warranties. It’s practice software, not professional coaching or instruction. Numbers from your data are estimates. To the extent the law allows, Lela Andrews isn’t liable for losses from using the app, including lost data, so keep backups."},{p:"**3. Other services.** Railbird, FargoRate, poolbilliards.co and the sites in Resources are independent; Electro-Coach isn’t affiliated with or endorsed by them, and their own terms apply when you use them."},{p:"**4. Your data is yours.** Your entries stay on your device and belong to you."},{p:"**5. Feedback and drill ideas.** If you send suggestions, bug reports or drill requests, you agree they can be used to improve Electro-Coach without payment or obligation. Credit is given where you’d like it and it’s practical."},{p:"**6. Contributions.** Support payments are voluntary gifts to the developer to fund development. They aren’t tax-deductible, aren’t refundable unless the payment site’s rules say otherwise, and don’t buy any features or promises. If a subscription is offered later, it will have its own clearly stated terms, and what’s free when you started won’t be taken away without notice."},{p:"**7. Changes.** These terms may be updated with an app release; continuing to use the app after an update means you accept the new version. Material changes will be noted in the release notes."},{p:"**8. Law.** These terms are governed by the laws of California, USA."}]},Td=["Electro-Coach isn’t for everyone, but if it helps you, please consider supporting my work.","In the interest of full transparency: there
